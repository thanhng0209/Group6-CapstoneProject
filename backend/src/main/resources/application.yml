spring:
  application:
    name: printerfarm-backend
  servlet:
    multipart:
      # G-code files from PrusaSlicer are typically 1-20 MB; 50 MB gives
      # ample headroom while preventing accidental large-file uploads.
      max-file-size: 50MB
      max-request-size: 52MB
  datasource:
    url: jdbc:postgresql://localhost:5432/printerfarm
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  mail:
    # Placeholder SMTP settings pending the team/client confirming which mail
    # relay to use for UWA-addressed notifications (e.g. a UWA SMTP relay vs.
    # a third-party transactional mail service).
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: 8080

printerfarm:
  job:
    cancellation-window-minutes: 5
  wallet:
    default-starting-balance: 50.00
  notification:
    from-address: printerfarm-noreply@uwa.edu.au
    # Placeholder mapping from UNI ID to email until the auth/user module
    # exposes each student's actual registered UWA email address.
    email-domain: "@student.uwa.edu.au"

app:
  jwt:
    # Intentionally no default: set JWT_SECRET (32+ chars) for any shared/deployed
    # environment. When unset, JwtUtil generates a random key at startup.
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
