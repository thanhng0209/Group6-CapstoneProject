spring:
  application:
    name: printerfarm-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/printerfarm
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  mail:
    # Placeholder SMTP settings pending the team/client confirming which mail
    # relay to use for UWA-addressed notifications (e.g. a UWA SMTP relay vs.
    # a third-party transactional mail service).
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: 8080

printerfarm:
  job:
    cancellation-window-minutes: 5
  wallet:
    default-starting-balance: 50.00
  notification:
    from-address: printerfarm-noreply@uwa.edu.au
    # Placeholder mapping from UNI ID to email until Person 1's auth/user
    # module exposes each student's actual registered UWA email address.
    email-domain: "@student.uwa.edu.au"
