spring:
  application:
    name: printerfarm-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/printerfarm
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8080

printerfarm:
  job:
    cancellation-window-minutes: 5
  wallet:
    default-starting-balance: 50.00

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-placeholder-secret-change-me-before-deploying-1234567890}
    expiration-ms: 86400000

