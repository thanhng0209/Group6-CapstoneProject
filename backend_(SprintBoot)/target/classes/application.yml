server:
  port: 8080

spring:
  application:
    name: printer-farm

  datasource:
    url: jdbc:postgresql://localhost:5432/printer_farm
    username: printer_farm_app
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate should only validate it matches.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Custom JWT settings — read via @Value in JwtUtil
app:
  jwt:
    # 256-bit+ secret. Override with a real secret via env var in every environment.
    secret: ${JWT_SECRET:this-is-a-placeholder-secret-change-me-before-deploying-1234567890}
    expiration-ms: 86400000   # 24 hours

logging:
  level:
    org.springframework.security: INFO
